    - name: Create release zip
      run: |
        set -e
        mkdir -p release-artifacts
        JAR=$(ls target/*.jar | head -n 1 || true)
        if [ -z "$JAR" ]; then
          echo "No jar found in target/ — build may have failed or the packaging is not 'jar'." >&2
          ls -la target || true
          exit 1
        fi
        cp "$JAR" release-artifacts/
        cd release-artifacts
        echo "Files to be archived:"
        ls -la
        # IMPORTANT: include a space before the dot so zip gets the file list
        zip -r ../release.zip .
        cd ..
